[package]
name = "eolify-cli"
version = "0.1.0"
edition = "2021"
authors = ["Mark Swaanenburg"]
license = "MIT/Apache-2.0"
keywords = ["eol", "newline", "line-endings", "crlf", "lf"]
categories = ["command-line-utilities", "encoding", "text-processing"]
readme = "../../README.md"
documentation = "https://docs.rs/eolify-cli"
repository = "https://github.com/cygnus9/eolify"
homepage = "https://github.com/cygnus9/eolify"
description = "Command-line newline normalization for files."

[[bin]]
name = "eolify"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
content_inspector = "0.2"
eolify = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
