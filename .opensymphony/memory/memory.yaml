code_intel:
  enabled: true
  ast:
    enabled: true
    max_file_bytes: 2097152
    max_files_per_request: 200
    max_matches_per_request: 2000
    max_capture_bytes: 4096
memory_root: .opensymphony/memory
visibility: private
index_path: .opensymphony/memory/memory.duckdb
confidence_threshold: 75
source_snapshots: hashes
markdown_indexes: true
docs:
  public_root: docs
  default_visibility: public
  deny_private_links: true
areas:
  cli-benchmark-notes:
    title: eolify CLI Benchmark Notes
    docs_target: docs/cli-benchmark-notes.md
    visibility: public
    status: stable
    confidence: 85
    aliases:
    - eolify CLI Benchmark Notes
    source_refs:
      docs:
      - docs/cli-benchmark-notes.md
