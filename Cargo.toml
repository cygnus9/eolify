[package]
name = "eolify"
version = "0.4.5"
edition = "2021"
rust-version = "1.81"
authors = ["Mark Swaanenburg"]
license = "MIT OR Apache-2.0"
keywords = ["eol", "newline", "line-endings", "crlf", "lf"]
categories = ["encoding", "text-processing"]
readme = "README.md"
documentation = "https://docs.rs/eolify"
repository = "https://github.com/cygnus9/eolify"
homepage = "https://github.com/cygnus9/eolify"
description = "Streaming line ending normalization for Rust, with sync and async I/O support."

[workspace]
members = ["crates/eolify-cli"]
exclude = ["fuzz"]

[dependencies]
futures-io = { version = "0.3.31", optional = true }
memchr = { version = "2.7", default-features = false }
pin-project-lite = { version = "0.2.16", optional = true }
tokio = { version = "1.48.0", default-features = false, optional = true }

[dev-dependencies]
criterion = "0.8.2"
futures-util = { version = "0.3.31", default-features = false, features = ["io"] }
macro_rules_attribute = "0.2.3"
newline-converter = "0.3.0"
newline_normalizer = "0.1.6"
proptest = "1.8.0"
regex = "1.12.2"
smol-macros = "0.1.1"
tokio = { version = "1.48.0", default-features = false, features = ["fs", "io-util", "macros", "rt"] }

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "to_unix"
harness = false

[[bench]]
name = "to_dos"
harness = false

[features]
default = ["std"]
std = ["alloc", "memchr/std"]
alloc = []
futures-io = ["std", "dep:futures-io", "dep:pin-project-lite"]
tokio = ["std", "dep:tokio", "dep:pin-project-lite"]

[[example]]
name = "normalize_str"
required-features = ["alloc"]

[[example]]
name = "sync_file_convert"
required-features = ["std"]

[[example]]
name = "tokio_file_convert"
required-features = ["tokio"]

[package.metadata."docs.rs"]
all-features = true
