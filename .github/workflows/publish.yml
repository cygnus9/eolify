name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version v$TAG_VERSION does not match Cargo.toml version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --check

      - name: Build
        run: cargo build --all-features

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --all-features --no-deps

      - name: Run tests without optional features
        run: cargo test --no-default-features

      - name: Run tests with tokio feature
        run: cargo test --features tokio

      - name: Run tests with futures-io feature
        run: cargo test --features futures-io

      - name: Run tests with all features
        run: cargo test --all-features

      - name: Package
        run: cargo package

      - name: Publish to crates.io
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo publish --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
